name: Build 3DS

on:
  push:
    branches:
      - main
      - 'prerelease/**'
      - 'release/**'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update GitHub Release and upload CIA/3DSX/QR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Nintendo 3DS packages
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Initialize required submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive third_party/mbedtls third_party/rcheevos

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < platform/3ds/version.txt)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION"

      - name: Verify bundled build tools
        run: |
          for tool in cmake make pkg-config zip; do
            command -v "$tool"
          done

      - name: Install CIA packaging tools
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import urllib.request
          import zipfile

          root = Path("/tmp/tmc-3ds-tools")
          root.mkdir(parents=True, exist_ok=True)

          downloads = [
              (
                  "bannertool.zip",
                  "https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip",
                  None,
              ),
          ]

          for name, url, expected_sha256 in downloads:
              archive = root / name
              urllib.request.urlretrieve(url, archive)
              if expected_sha256:
                  digest = hashlib.sha256(archive.read_bytes()).hexdigest()
                  if digest != expected_sha256:
                      raise SystemExit(f"Checksum mismatch for {name}: {digest}")
              out = root / name.removesuffix(".zip")
              out.mkdir(exist_ok=True)
              with zipfile.ZipFile(archive) as zf:
                  zf.extractall(out)
          PY

          git clone --depth 1 --branch makerom-v0.19.0 https://github.com/3DSGuy/Project_CTR.git /tmp/tmc-3ds-tools/Project_CTR
          make -C /tmp/tmc-3ds-tools/Project_CTR/makerom deps
          make -C /tmp/tmc-3ds-tools/Project_CTR/makerom
          MAKEROM="/tmp/tmc-3ds-tools/Project_CTR/makerom/bin/makerom"
          BANNERTOOL="/tmp/tmc-3ds-tools/bannertool/linux-x86_64/bannertool"
          test -x "$MAKEROM"
          test -f "$BANNERTOOL"
          install -m 0755 "$MAKEROM" /usr/local/bin/makerom
          install -m 0755 "$BANNERTOOL" /usr/local/bin/bannertool
          command -v makerom
          command -v bannertool

      - name: Build CIA and 3DSX
        run: ./platform/3ds/build.sh

      - name: Verify build outputs and legal files
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          test ! -f baserom.gba
          ! git ls-files | grep -Ei '(^|/)([^/]*\.gba|[^/]*\.sav|[^/]*\.ppu1|tmc3ds\.log|bugreport_.*)(/|$)'
          ! git ls-files | grep -E '(^|/)(AGENTS\.md|PROTOCOL\.md|WORKFLOW\.md|GITHUB_RELEASE_WORKFLOW\.md)$'
          test -f "build-3ds/game/tmc-3ds-v${VERSION}.3dsx"
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish_release }}" = "true" ]; } || \
             { [ "${{ github.event_name }}" = "push" ] && { [[ "${{ github.ref }}" == refs/heads/prerelease/* ]] || [[ "${{ github.ref }}" == refs/heads/release/* ]]; } && [[ "${{ github.event.head_commit.message }}" == release:* ]]; }; then
            test -f "build-3ds/game/tmc-3ds-v${VERSION}.cia"
          fi

      - name: Create SHA256 checksums
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          cd build-3ds/game
          sha256sum "tmc-3ds-v${VERSION}.3dsx" > "tmc-3ds-v${VERSION}-SHA256SUMS.txt"
          if [ -f "tmc-3ds-v${VERSION}.cia" ]; then
            sha256sum "tmc-3ds-v${VERSION}.cia" >> "tmc-3ds-v${VERSION}-SHA256SUMS.txt"
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: tmc-3ds-v${{ steps.meta.outputs.version }}
          if-no-files-found: error
          path: |
            build-3ds/game/tmc-3ds-v${{ steps.meta.outputs.version }}.3dsx
            build-3ds/game/tmc-3ds-v${{ steps.meta.outputs.version }}.cia
            build-3ds/game/tmc-3ds-v${{ steps.meta.outputs.version }}-SHA256SUMS.txt

  manifest-tests:
    name: Updater manifest tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install host test dependency
        run: sudo apt-get update && sudo apt-get install -y libjansson-dev

      - name: Build and run updater manifest tests
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Iplatform/3ds/source \
            platform/3ds/source/update_manifest.c \
            platform/3ds/tests/update_manifest_test.c \
            -ljansson -o /tmp/update_manifest_test
          /tmp/update_manifest_test

  publish:
    name: Publish release
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
      (github.event_name == 'push' &&
       (startsWith(github.ref, 'refs/heads/prerelease/') ||
        startsWith(github.ref, 'refs/heads/release/')) &&
       startsWith(github.event.head_commit.message, 'release:'))
    needs: [build, manifest-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download compiled packages
        uses: actions/download-artifact@v8
        with:
          name: tmc-3ds-v${{ needs.build.outputs.version }}
          path: release-assets

      - name: Prepare permanent release aliases
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          cp "release-assets/tmc-3ds-v${VERSION}.cia" "release-assets/tmc-3ds-latest.cia"
          cp "release-assets/tmc-3ds-v${VERSION}.3dsx" "release-assets/tmc-3ds-latest.3dsx"
          cp "release-assets/tmc-3ds-v${VERSION}-SHA256SUMS.txt" "release-assets/tmc-3ds-latest-SHA256SUMS.txt"

      - name: Generate FBI QR
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          python3 -m pip install --user "qrcode[pil]"
          python3 - <<'PY'
          import os
          import qrcode
          version = os.environ["VERSION"]
          repo = os.environ["GITHUB_REPOSITORY"]
          version_url = f"https://github.com/{repo}/releases/download/v{version}/tmc-3ds-v{version}.cia"
          latest_url = f"https://github.com/{repo}/releases/latest/download/tmc-3ds-latest.cia"
          qrcode.make(version_url).save(f"release-assets/tmc-3ds-v{version}-qr.png")
          qrcode.make(latest_url).save("release-assets/tmc-3ds-latest-qr.png")
          print(version_url)
          print(latest_url)
          PY
        env:
          VERSION: ${{ needs.build.outputs.version }}

      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NOTES="RELEASE_NOTES_v${VERSION}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-assets/RELEASE_NOTES.md
          else
            {
              echo "# v${VERSION}"
              echo
              echo "Automated 3DS build."
              echo
              echo "The original ROM is not included."
            } > release-assets/RELEASE_NOTES.md
          fi

          {
            echo
            echo "## Install with FBI"
            echo
            echo 'In FBI: `Remote Install > Scan QR Code`'
            echo
            echo '<p align="center">'
            echo "  <a href=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/tmc-3ds-v${VERSION}.cia\">"
            echo "    <img width=\"320\" alt=\"FBI QR Code for v${VERSION}\" src=\"https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/tmc-3ds-v${VERSION}-qr.png\" />"
            echo "  </a>"
            echo "</p>"
            echo
            echo "- [Download CIA](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/tmc-3ds-v${VERSION}.cia)"
            echo "- [Download 3DSX](https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/tmc-3ds-v${VERSION}.3dsx)"
          } >> release-assets/RELEASE_NOTES.md

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.build.outputs.version }}
          body_path: release-assets/RELEASE_NOTES.md
          prerelease: ${{ contains(needs.build.outputs.version, '-E') }}
          make_latest: ${{ contains(needs.build.outputs.version, '-E') && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/tmc-3ds-v${{ needs.build.outputs.version }}.cia
            release-assets/tmc-3ds-v${{ needs.build.outputs.version }}.3dsx
            release-assets/tmc-3ds-v${{ needs.build.outputs.version }}-qr.png
            release-assets/tmc-3ds-v${{ needs.build.outputs.version }}-SHA256SUMS.txt
            release-assets/tmc-3ds-latest.cia
            release-assets/tmc-3ds-latest.3dsx
            release-assets/tmc-3ds-latest-qr.png
            release-assets/tmc-3ds-latest-SHA256SUMS.txt


      - name: Clean prerelease history after stable release
        if: ${{ !contains(needs.build.outputs.version, '-E') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Keep the public Releases page focused on stable builds.
          # Normalize stable release titles, then remove experimental E-series
          # release entries and their tags only after the new stable release
          # has been published successfully.
          for tag in v1.0.1 v1.1 "v${VERSION}"; do
            gh release edit "${tag}" --title "${tag}" --repo "${GITHUB_REPOSITORY}" 2>/dev/null || true
          done

          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.prerelease == true) | .tag_name' |
          while IFS= read -r tag; do
            case "${tag}" in
              v*-E*)
                echo "Removing prerelease ${tag}"
                if ! gh release delete "${tag}" --cleanup-tag --yes --repo "${GITHUB_REPOSITORY}"; then
                  echo "Release ${tag} was already absent; cleaning tag if present."
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" 2>/dev/null || true
                fi
                ;;
            esac
          done
